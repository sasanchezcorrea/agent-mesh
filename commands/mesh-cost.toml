description = "Show the provider-adapted agentmesh cost dashboard for each orchestrated MCP server"
prompt = "Run `node dashboard/cost-report.js` from the agentmesh plugin root (resolve the path from this plugin's own install location) and print its output verbatim as the response — do not reformat, summarize, or invent numbers on top of it. The script auto-detects Copilot CLI or Claude Code and reports provider-native units. If it errors or names an unsupported provider, report the exact error and stop. One shot: do not change mode, write flag files, or persist anything."
